# VoidLink2 NAT Testing CI/CD Pipeline
# Runs on schedule (weekly) and manual dispatch
# Provisions cloud VMs, runs test suite, collects metrics, tears down

name: NAT Testing

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      test_scenario:
        description: 'Test scenario to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - basic
          - relay
          - direct-p2p
          - server-restart
          - relay-fallback
          - multi-client
          - reconnect
      keep_vms:
        description: 'Keep VMs running after test for debugging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.7.0"
  ANSIBLE_VERSION: "2.15.0"

jobs:
  pre-checks:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Terraform config
        run: |
          cd infrastructure/terraform
          terraform fmt -check -diff
          terraform validate
      - name: Check Ansible config
        run: |
          cd infrastructure/ansible
          ansible-playbook --syntax-check playbook.yml

  provision:
    name: Provision Infrastructure
    needs: pre-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init

  test:
    name: Run NAT Tests
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Print test scenario
        run: |
          echo "Test scenario: ${{ github.event.inputs.test_scenario }}"
          echo "Keep VMs: ${{ github.event.inputs.keep_vms }}"