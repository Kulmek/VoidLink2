name: CI

on:
  pull_request:
  push:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Новый пуш в ту же ветку/PR отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Форматирование всего workspace.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # Кроссплатформенные крейты на Linux: всё, кроме Windows-only
  # (client зависит от wintun, tray и winsvc — только Windows).
  # Новые кроссплатформенные крейты (tunnel-ipc, tunnel-daemon, …)
  # подхватываются автоматически — список исключений, а не включений.
  # Отсутствующий в workspace пакет в --exclude даёт лишь warning.
  linux:
    name: test · ubuntu (кроссплатформенные крейты)
    runs-on: ubuntu-latest
    env:
      EXCLUDES: --exclude tunnel-client --exclude tunnel-tray --exclude tunnel-winsvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Тесты
        run: cargo test --workspace $EXCLUDES
      - name: Clippy
        run: cargo clippy --workspace $EXCLUDES --all-targets -- -D warnings

  # Полный workspace (включая client/TUI, tray, winsvc) — только на Windows.
  windows:
    name: test · windows (весь workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Тесты
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Лицензии, баны, источники, advisories — по deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          manifest-path: ./Cargo.toml

  # Уязвимости в Cargo.lock по базе RustSec.
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Релизный tunnel-server под Linux + systemd-юнит (если есть).
  build-linux-server:
    name: build · linux server release
    needs: [fmt, linux, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Сборка (release)
        run: cargo build --release -p tunnel-server --target x86_64-unknown-linux-gnu
      - name: Собрать артефакты
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/tunnel-server dist/
          # systemd-юнит и прочие файлы деплоя — если уже появились.
          if [ -d infrastructure/linux ]; then
            shopt -s nullglob
            for f in infrastructure/linux/*.service infrastructure/linux/*.sh infrastructure/linux/*.conf; do
              cp "$f" dist/
            done
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-server-linux-x64
          path: dist/
          retention-days: 14

  # Сборка релиза для Windows: exe-шники + подписанный wintun.dll
  # + PowerShell-скрипты установки в один артефакт.
  build-windows:
    name: build · windows release
    needs: [fmt, linux, windows, deny]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Сборка (release)
        run: cargo build --release --workspace
      - name: Собрать артефакты
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory dist | Out-Null
          # Бинарники кладём только те, что реально собрались
          # (daemon/tray появляются по ходу Этапа 7).
          foreach ($exe in 'tunnel-client', 'tunnel-server', 'tunnel-daemon', 'tunnel-tray') {
            $path = "target/release/$exe.exe"
            if (Test-Path $path) {
              Copy-Item $path dist/
            } else {
              Write-Host "пропуск: $path не найден"
            }
          }
          Copy-Item vendor/wintun/wintun.dll dist/
          if (Test-Path infrastructure/windows) {
            Get-ChildItem infrastructure/windows -Filter *.ps1 | Copy-Item -Destination dist/
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-windows-x64
          path: dist/
          retention-days: 14
