[package]
name = "tunnel-client"
version = "0.2.0"
edition = "2024"

[dependencies]
tunnel-protocol = { path = "../protocol" }
anyhow.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
wintun.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# e2e-тесты движка: настоящий сервер в том же процессе.
tunnel-server = { path = "../server" }
