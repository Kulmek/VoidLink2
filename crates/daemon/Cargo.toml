[package]
name = "tunnel-daemon"
version = "0.2.0"
edition = "2024"

[lib]
name = "tunnel_daemon"
path = "src/lib.rs"

[[bin]]
name = "tunnel-daemon"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
