[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/client"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
crossterm = "0.29"
rand = "0.8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wintun = "0.5"

[profile.release]
strip = true
